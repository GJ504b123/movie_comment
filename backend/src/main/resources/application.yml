server:
  port: ${SERVER_PORT:8080}

spring:
  # 让 Spring 直接读取 backend/.env（KEY=VALUE 格式，按 properties 解析；文件不存在则忽略）
  # 这样 .env.example 抄成 .env 就能生效，无需手动 export 环境变量
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_comment?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:default-jwt-secret-for-dev-only-change-in-production}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

logging:
  level:
    com.movie.comment: DEBUG
